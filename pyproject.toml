[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-tutor"
version = "0.1.0"
description = "An LLM-native Japanese tutor with source-grounded curriculum and learner evidence"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2.12,<3",
    "pymupdf>=1.26,<2",
    "typer>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
jt = "japanese_tutor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
